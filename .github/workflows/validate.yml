name: Validate signals

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run codec and file-format tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild all Sub-GHz files
        run: python generator/generate.py

      - name: Confirm generated files are committed
        run: git diff --exit-code
