<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">PixMob Wave2 — Flipper Zero RF Controller</title>
  <desc id="bannerDesc">Wordmark for the PixMob Wave2 project: an abstract wristband ring receiving radio waves from a small handheld controller, beside the text "PixMob Wave2", the subtitle "Flipper Zero RF Controller", and the technical line "868.415 MHz, Sub-GHz, Group 0".</desc>

  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16A866"/>
      <stop offset="0.55" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#C8FFE0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16A866" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#16A866" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="300" fill="#080F0B"/>
  <ellipse cx="150" cy="150" rx="300" ry="215" fill="url(#glow)"/>

  <g transform="translate(0,-20)">
    <!-- handheld controller -->
    <rect x="40" y="148" width="26" height="44" rx="9" fill="none" stroke="#9BAAA0" stroke-width="4" opacity="0.75"/>
    <circle cx="53" cy="160" r="3" fill="#39FF88"/>

    <!-- radio waves -->
    <g fill="none" stroke="#39FF88" stroke-width="4" stroke-linecap="round">
      <path d="M79.9 159.3 A16 16 0 0 1 79.9 180.7" opacity="0.95"/>
      <path d="M87.3 152.6 A26 26 0 0 1 87.3 187.4" opacity="0.6"/>
      <path d="M94.8 145.9 A36 36 0 0 1 94.8 194.1" opacity="0.32"/>
    </g>

    <!-- wristband ring -->
    <path d="M105.2 143 A54 54 0 1 1 105.2 197" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>

    <!-- LEDs on the band -->
    <g fill="#39FF88">
      <circle cx="179.7" cy="154" r="4.5" opacity="0.5"/>
      <circle cx="184" cy="170" r="4.5"/>
      <circle cx="179.7" cy="186" r="4.5" opacity="0.5"/>
    </g>

    <!-- divider -->
    <line x1="232" y1="114" x2="232" y2="226" stroke="#F4F7F5" stroke-opacity="0.12" stroke-width="2"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="264" y="158" font-size="70" font-weight="700" letter-spacing="-2" fill="#F4F7F5">PixMob Wave2</text>
      <text x="266" y="199" font-size="26" font-weight="500" letter-spacing="0.2" fill="#9BAAA0">Flipper Zero RF Controller</text>
      <text x="266" y="246" font-size="19" font-weight="600" letter-spacing="0.6" fill="#39FF88">868.415 MHz · Sub-GHz · Group 0</text>
    </g>

    <rect x="264" y="215" width="300" height="2" fill="url(#rule)"/>
  </g>
</svg>
