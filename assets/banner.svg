<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">PixMob Wave2 Flipper Zero Controller</title>
  <desc id="description">Colorful radio waves connecting a Flipper Zero to an LED wristband</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b1a"/>
      <stop offset="0.55" stop-color="#17123a"/>
      <stop offset="1" stop-color="#062d3c"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.2" stop-color="#f59e0b"/>
      <stop offset="0.4" stop-color="#84cc16"/>
      <stop offset="0.6" stop-color="#06b6d4"/>
      <stop offset="0.8" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1100" cy="65" r="170" fill="#7c3aed" opacity=".09"/>
  <circle cx="110" cy="395" r="230" fill="#06b6d4" opacity=".08"/>

  <g transform="translate(74 86)">
    <rect x="0" y="0" width="142" height="248" rx="34" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="18" y="28" width="106" height="78" rx="10" fill="#d9f99d"/>
    <path d="M43 69h56M71 42v54" stroke="#365314" stroke-width="7" stroke-linecap="round"/>
    <circle cx="71" cy="151" r="31" fill="#f97316"/>
    <circle cx="71" cy="151" r="14" fill="#fed7aa"/>
    <circle cx="42" cy="207" r="9" fill="#475569"/>
    <circle cx="71" cy="207" r="9" fill="#475569"/>
    <circle cx="100" cy="207" r="9" fill="#475569"/>
  </g>

  <g fill="none" stroke="url(#spectrum)" stroke-linecap="round" filter="url(#glow)">
    <path d="M260 210c65-76 131-76 196 0" stroke-width="7" opacity=".95"/>
    <path d="M289 210c46-48 92-48 138 0" stroke-width="6" opacity=".8"/>
    <path d="M323 210c24-23 48-23 72 0" stroke-width="5" opacity=".65"/>
  </g>
  <circle cx="358" cy="210" r="8" fill="#22d3ee" filter="url(#glow)"/>

  <g transform="translate(1010 110)">
    <path d="M0 48c0-30 24-54 54-54h76c30 0 54 24 54 54v104c0 30-24 54-54 54H54c-30 0-54-24-54-54z" fill="none" stroke="#cbd5e1" stroke-width="15"/>
    <rect x="43" y="42" width="98" height="116" rx="28" fill="#111827" stroke="#64748b" stroke-width="4"/>
    <circle cx="72" cy="78" r="15" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="112" cy="78" r="15" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="92" cy="120" r="15" fill="#3b82f6" filter="url(#glow)"/>
  </g>

  <text x="490" y="153" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="750" letter-spacing="-1.5">PixMob Wave2</text>
  <text x="490" y="216" fill="url(#spectrum)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="41" font-weight="700">Flipper Zero Controller</text>
  <text x="492" y="264" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">868.415 MHz · OOK · Group 0 · Ready-to-use .sub files</text>
  <rect x="490" y="294" width="409" height="42" rx="21" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="515" y="322" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">WAKE  →  COLOR  →  QUICK CONTROL  →  OFF</text>
</svg>
